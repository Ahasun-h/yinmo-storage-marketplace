name: urban_koala
description: "A new Flutter project."

publish_to: 'none' 

# version: 1.0.0+4 for android version 1.0.0+7 for ios
version: 1.0.0+7

environment:
  sdk: ^3.5.0


dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  auto_animated: ^3.2.0
  dio: ^5.9.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  get_storage: ^2.1.1
  get_it: ^8.2.0
  http: ^1.5.0
  provider: ^6.1.5+1
  fluttertoast: ^9.0.0
  rxdart: ^0.27.7
  flutter_displaymode: ^0.7.0
  flutter_svg: ^2.2.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.0
  path: ^1.8.3
  pinput: ^5.0.2
  flutter_switch: ^0.3.2
  flutter_spinkit: ^5.2.2
  lottie: ^3.3.2
  geocoding: ^4.0.0
  geolocator: ^14.0.1
  google_maps_flutter: ^2.14.0
  google_maps_flutter_platform_interface: ^2.14.0
  cached_network_image_pro: ^0.0.7
  flutter_stripe: ^13.0.0
  path_provider: ^2.1.5
  dart_pusher_channels: ^1.2.3
  flutter_keyboard_visibility: ^6.0.0
  cached_network_image: ^3.4.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  firebase_core: ^4.3.0
  apple_maps_flutter: ^1.4.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:

  
  flutter_lints: ^5.0.0

flutter_gen:
  output: lib/gen/
  line_length: 80

  colors:
    inputs:
      - assets/color/colors.xml
    outputs:
      class_name: AppColors


flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/